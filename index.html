<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartClass Tracker | Campus Occupancy</title>
    <style>
        /* THEME VARIABLES */
        :root {
            --bg: #f8fafc;
            --nav-bg: #1e293b;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        /* DARK MODE COLORS */
        [data-theme="dark"] {
            --bg: #0f172a;
            --nav-bg: #020617;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Navigation & Logo */
        .top-nav { 
            background: var(--nav-bg); 
            color: white; 
            padding: 12px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; top: 0; z-index: 100; 
        }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
        .logo-box { background: var(--primary); padding: 5px 12px; border-radius: 8px; color: white; box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3); }

        .nav-controls { display: flex; align-items: center; gap: 15px; }

        .theme-toggle {
            background: none; border: 1px solid #475569; color: white;
            padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
        }

        .btn-auth { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-auth:hover { opacity: 0.9; transform: scale(1.02); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        /* Dashboard Stats */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
        .stat-card p { font-size: 2.2rem; font-weight: 800; margin: 5px 0; }
        .stat-card span { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; }

        /* Filter Controls */
        .filter-area {
            background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 30px; box-shadow: var(--shadow);
        }
        .chip-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .chip { 
            padding: 8px 20px; border-radius: 25px; border: 1px solid var(--border); 
            background: var(--bg); color: var(--text-main); cursor: pointer; 
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; 
        }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .select-row { display: flex; gap: 10px; }
        select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-size: 0.9rem; cursor: pointer; }

        /* Room Cards Grid */
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .room-card { 
            background: var(--card-bg); border-radius: 18px; padding: 25px; 
            box-shadow: var(--shadow); border: 1px solid var(--border);
            position: relative; transition: all 0.3s ease;
        }
        .room-card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }

        .status-pill { position: absolute; top: 20px; right: 20px; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .free { background: #dcfce7; color: #166534; }
        .occupied { background: #fee2e2; color: #991b1b; }
        
        [data-theme="dark"] .free { background: #064e3b; color: #34d399; }
        [data-theme="dark"] .occupied { background: #7f1d1d; color: #fca5a5; }

        .admin-section { display: none; margin-top: 18px; padding-top: 15px; border-top: 1px dashed var(--border); }
        body.is-admin .admin-section { display: block; }
        .toggle-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }

        footer { text-align: center; padding: 50px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border); margin-top: 40px; }
    </style>
</head>
<body id="pageBody">

    <nav class="top-nav">
        <div class="logo">
            <div class="logo-box">SCT</div> SmartClass Tracker
        </div>
        <div class="nav-controls">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
            <button class="btn-auth" id="authBtn" onclick="handleLogin()">Staff Login</button>
        </div>
    </nav>

    <div class="container">
        <header style="margin-bottom: 35px;">
            <h1>Campus Occupancy Monitor</h1>
            <p id="roleStatus" style="color: var(--text-muted);">Access Level: Student (Read Only)</p>
        </header>

        <div class="dashboard">
            <div class="stat-card"><span>Available</span><p id="sFree" style="color: var(--success);">0</p></div>
            <div class="stat-card"><span>Occupied</span><p id="sBusy" style="color: var(--danger);">0</p></div>
            <div class="stat-card"><span>Total Units</span><p id="sTotal">0</p></div>
        </div>

        <div class="filter-area">
            <div class="chip-group" id="typeChips">
                <div class="chip active" onclick="setCategory('All', this)">All Rooms</div>
                <div class="chip" onclick="setCategory('Lab', this)">Laboratories</div>
                <div class="chip" onclick="setCategory('Room', this)">Classrooms</div>
                <div class="chip" onclick="setCategory('Hall', this)">Audit Halls</div>
            </div>

            <div class="select-row">
                <select id="bFilt" onchange="render()">
                    <option value="All">All Campus Zones</option>
                    <option value="Science Wing (North)">Science Wing (North)</option>
                    <option value="Science Wing (South)">Science Wing (South)</option>
                    <option value="Tech Center (East)">Tech Center (East)</option>
                    <option value="Tech Center (West)">Tech Center (West)</option>
                    <option value="Main Block">Main Academic Block</option>
                </select>
            </div>
        </div>

        <div class="room-grid" id="grid"></div>
    </div>

    <footer>&copy; 2026 SmartClass Tracker | IT Dept Project</footer>

    <script>
        // Professional Dataset
        const roomsData = [
            { id: 1, name: "Physics Lab 01", bld: "Science Wing (North)", type: "Lab", flr: "1", status: "Free", updated: "09:00 AM" },
            { id: 2, name: "Lecture Hall 101", bld: "Main Block", type: "Room", flr: "1", status: "Occupied", updated: "10:30 AM" },
            { id: 3, name: "Advanced Java Lab", bld: "Tech Center (East)", type: "Lab", flr: "2", status: "Free", updated: "08:15 AM" },
            { id: 4, name: "Graphics Studio", bld: "Tech Center (West)", type: "Lab", flr: "3", status: "Free", updated: "11:00 AM" },
            { id: 5, name: "Chemistry Lab 02", bld: "Science Wing (South)", type: "Lab", flr: "1", status: "Occupied", updated: "09:45 AM" },
            { id: 6, name: "IT Project Lab", bld: "Tech Center (East)", type: "Lab", flr: "2", status: "Free", updated: "07:30 AM" },
            { id: 7, name: "Conference Room A", bld: "Main Block", type: "Room", flr: "2", status: "Free", updated: "12:00 PM" },
            { id: 8, name: "Digital Library", bld: "Main Block", type: "Room", flr: "1", status: "Occupied", updated: "11:15 AM" },
            { id: 9, name: "Botany Lab", bld: "Science Wing (North)", type: "Lab", flr: "2", status: "Free", updated: "09:20 AM" },
            { id: 10, name: "Embedded Systems Lab", bld: "Tech Center (East)", type: "Lab", flr: "3", status: "Occupied", updated: "02:00 PM" },
            { id: 11, name: "Audit Room 404", bld: "Main Block", type: "Hall", flr: "4", status: "Free", updated: "10:00 AM" },
            { id: 12, name: "Main Server Room", bld: "Tech Center (West)", type: "Room", flr: "G", status: "Occupied", updated: "Always" },
            { id: 13, name: "Language Lab", bld: "Main Block", type: "Lab", flr: "3", status: "Free", updated: "08:45 AM" },
            { id: 14, name: "Mechanical Workshop", bld: "Science Wing (South)", type: "Lab", flr: "G", status: "Free", updated: "09:00 AM" },
            { id: 15, name: "Startup Incubator", bld: "Tech Center (West)", type: "Room", flr: "4", status: "Free", updated: "11:30 AM" }
        ];

        let rooms = JSON.parse(localStorage.getItem('sct_data_v1')) || roomsData;
        let isAdmin = false;
        let activeCategory = 'All';

        // DARK MODE HANDLER
        function toggleTheme() {
            const body = document.documentElement;
            const target = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', target);
            localStorage.setItem('sct_theme', target);
            document.getElementById('themeBtn').innerText = target === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        const savedTheme = localStorage.getItem('sct_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if(savedTheme === 'dark') document.getElementById('themeBtn').innerText = '☀️ Light Mode';

        // STAFF ACCESS HANDLER
        function handleLogin() {
            if(!isAdmin) {
                if(prompt("Enter Staff Access Code:") === "admin123") {
                    isAdmin = true;
                    document.body.classList.add('is-admin');
                    document.getElementById('authBtn').innerText = "Logout";
                    document.getElementById('roleStatus').innerText = "Access Level: Staff Member (Admin)";
                }
            } else {
                isAdmin = false;
                document.body.classList.remove('is-admin');
                document.getElementById('authBtn').innerText = "Staff Login";
                document.getElementById('roleStatus').innerText = "Access Level: Student (Read Only)";
            }
            render();
        }

        // FILTER LOGIC
        function setCategory(cat, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            activeCategory = cat;
            render();
        }

        // UPDATE STATUS
        function toggleRoom(id) {
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            rooms = rooms.map(r => r.id === id ? {...r, status: r.status === "Free" ? "Occupied" : "Free", updated: now} : r);
            localStorage.setItem('sct_data_v1', JSON.stringify(rooms));
            render();
        }

        // RENDER UI
        function render() {
            const grid = document.getElementById('grid');
            const bFilt = document.getElementById('bFilt').value;
            grid.innerHTML = '';

            const filtered = rooms.filter(r => {
                const bMatch = bFilt === 'All' || r.bld === bFilt;
                const cMatch = activeCategory === 'All' || r.type === activeCategory;
                return bMatch && cMatch;
            });

            filtered.forEach(r => {
                grid.innerHTML += `
                    <div class="room-card">
                        <span class="status-pill ${r.status.toLowerCase()}">${r.status}</span>
                        <h3 style="margin:5px 0; font-size:1.2rem;">${r.name}</h3>
                        <p style="color:var(--text-muted); font-size:0.85rem; font-weight:500;">${r.bld}</p>
                        <p style="color:var(--text-muted); font-size:0.8rem; margin-top:5px;">Floor: ${r.flr}</p>
                        <p style="font-size:0.75rem; color:var(--text-muted); margin-top:12px; border-top: 1px solid var(--border); padding-top:10px;">🕒 Last Check: ${r.updated}</p>
                        <div class="admin-section">
                            <button class="toggle-btn" onclick="toggleRoom(${r.id})">Update Status</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('sFree').innerText = rooms.filter(r => r.status === "Free").length;
            document.getElementById('sBusy').innerText = rooms.filter(r => r.status === "Occupied").length;
            document.getElementById('sTotal').innerText = rooms.length;
        }

        window.onload = render;
    </script>
</body>
</html>
